<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METO MATRIX</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">

<style>
:root{
  --bg:#000;
  --g:#00ff88;
  --gd:#00cc6a;
  --txt:#b7ffda;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:"Courier New", monospace;
  overflow:hidden;
}

/* MATRIX BACKGROUND */
canvas{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none; /* الحل الذهبي */
}

/* APP */
.app{
  max-width:380px;
  margin:10px auto;
  position:relative;
  z-index:2;
  border:2px solid var(--gd);
  border-radius:14px;
  padding:8px;
}
.screen{
  background:rgba(0,0,0,.88);
  border:1px solid var(--gd);
  border-radius:10px;
  padding:10px;
  min-height:420px;
}
.header{
  text-align:center;
}
.header h1{
  margin:0;
  color:var(--g);
}
.status{
  font-size:12px;
  opacity:.8;
}

/* MENU */
.menu{
  list-style:none;
  padding:0;
  margin-top:14px;
}
.menu li{
  padding:6px;
}
.menu li.active{
  background:rgba(0,255,136,.15);
  border-left:3px solid var(--g);
}

/* VIEW */
#view{
  display:none;
  margin-top:10px;
}
.small{
  font-size:13px;
  opacity:.85;
}

/* FOOTER */
.footer{
  display:flex;
  gap:6px;
  margin-top:12px;
}
button{
  flex:1;
  background:#02140b;
  color:var(--g);
  border:1px solid var(--gd);
  border-radius:6px;
  padding:6px;
  font-family:inherit;
}
button:active{
  background:#04351e;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="app">
<div class="screen">

<div class="header">
  <h1>METO MATRIX</h1>
  <div class="status" id="topStatus"></div>
</div>

<!-- HOME -->
<div id="home">
  <ul class="menu" id="menu">
    <li class="active">Dashboard</li>
    <li>Network</li>
    <li>Device</li>
    <li>Battery</li>
    <li>Security</li>
    <li>Settings</li>
    <li>About</li>
  </ul>
</div>

<!-- VIEW -->
<div id="view">
  <h3 id="viewTitle"></h3>
  <div id="viewBody" class="small"></div>
</div>

<div class="footer">
  <button id="up">▲</button>
  <button id="ok">OK</button>
  <button id="down">▼</button>
  <button id="back">⬅</button>
</div>

</div>
</div>

<script>
/* ================= MATRIX ================= */
const c=document.getElementById("matrix"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();onresize=resize;
const chars="01METO";
const cols=Math.floor(c.width/14);
const drops=Array(cols).fill(1);

setInterval(()=>{
  ctx.fillStyle="rgba(0,0,0,.1)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#00ff88";
  ctx.font="14px monospace";
  for(let i=0;i<drops.length;i++){
    const t=chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(t,i*14,drops[i]*14);
    if(drops[i]*14>c.height&&Math.random()>.95)drops[i]=0;
    drops[i]++;
  }
},50);

/* ================= TOP STATUS ================= */
function updateStatus(){
  document.getElementById("topStatus").innerText =
    (navigator.onLine?"● Online":"● Offline") +
    " | " + new Date().toLocaleTimeString();
}
setInterval(updateStatus,1000);
updateStatus();

/* ================= NAVIGATION ================= */
const menuItems=document.querySelectorAll("#menu li");
const home=document.getElementById("home");
const view=document.getElementById("view");
const viewTitle=document.getElementById("viewTitle");
const viewBody=document.getElementById("viewBody");

let index=0;
let inView=false;

function renderMenu(){
  menuItems.forEach((li,i)=>li.classList.toggle("active",i===index));
}

function openView(title,content){
  inView=true;
  home.style.display="none";
  view.style.display="block";
  viewTitle.innerText=title;
  viewBody.innerHTML=content;
}

function backHome(){
  inView=false;
  view.style.display="none";
  home.style.display="block";
}

/* ================= REAL CONTENT ================= */
function dashboard(){
  openView("Dashboard",`
    Time: ${new Date().toLocaleString()}<br>
    Online: ${navigator.onLine}<br>
    Platform: ${navigator.platform}<br>
    PWA: ${window.matchMedia('(display-mode: standalone)').matches}
  `);
}
function network(){
  const n=navigator.connection||{};
  openView("Network",`
    Type: ${n.effectiveType||"N/A"}<br>
    Downlink: ${n.downlink||"?"} Mb/s<br>
    RTT: ${n.rtt||"?"} ms
  `);
}
function device(){
  openView("Device",`
    Resolution: ${screen.width} x ${screen.height}<br>
    Orientation: ${screen.orientation?.type||"N/A"}<br>
    Memory: ${navigator.deviceMemory||"?"} GB<br>
    Touch: ${"ontouchstart" in window}
  `);
}
function battery(){
  if(!navigator.getBattery){
    openView("Battery","Battery API not supported");
    return;
  }
  navigator.getBattery().then(b=>{
    openView("Battery",`
      Level: ${Math.round(b.level*100)}%<br>
      Charging: ${b.charging}
    `);
  });
}
function security(){
  openView("Security",`
    HTTPS: ${location.protocol==="https:"}<br>
    Secure Context: ${window.isSecureContext}<br>
    Service Worker: ${"serviceWorker" in navigator}
  `);
}
function settings(){
  openView("Settings",`
    Matrix: ON<br>
    Performance: Auto<br>
    Language: AR / EN
  `);
}
function about(){
  openView("About",`
    METO MATRIX<br>
    System Utility PWA<br>
    Built with ❤️
  `);
}

const actions=[
  dashboard,network,device,battery,
  security,settings,about
];

/* ================= BUTTON EVENTS ================= */
document.getElementById("up").onclick=()=>{
  if(!inView && index>0){index--;renderMenu();}
};
document.getElementById("down").onclick=()=>{
  if(!inView && index<menuItems.length-1){index++;renderMenu();}
};
document.getElementById("ok").onclick=()=>{
  if(!inView) actions[index]();
};
document.getElementById("back").onclick=()=>{
  if(inView) backHome();
};

renderMenu();

/* ================= SERVICE WORKER ================= */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
